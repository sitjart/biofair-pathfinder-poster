<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="FAIR data network bridge illustration">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#f47d20" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f47d20" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft halo -->
  <ellipse cx="380" cy="190" rx="280" ry="180" fill="url(#halo)"/>

  <!-- curving connector ribbons (the "bridge") -->
  <path d="M40 320 C 180 280, 240 120, 420 110 S 560 80, 590 60"
        fill="none" stroke="#023452" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M40 360 C 220 300, 300 200, 460 170 S 560 140, 588 130"
        fill="none" stroke="#f47d20" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M30 250 C 180 240, 320 80,  500 60 S 580 40, 590 20"
        fill="none" stroke="#037eab" stroke-width="2.5" stroke-linecap="round" opacity="0.7" stroke-dasharray="4 7"/>

  <!-- nodes (research practice ←→ guidance) -->
  <!-- left cluster: guidance -->
  <circle cx="60"  cy="80"  r="14" fill="#023452"/>
  <circle cx="120" cy="50"  r="9"  fill="#037eab"/>
  <circle cx="40"  cy="200" r="11" fill="#023452"/>
  <circle cx="110" cy="160" r="7"  fill="#037eab"/>

  <!-- right cluster: everyday practice -->
  <circle cx="520" cy="300" r="14" fill="#f47d20"/>
  <circle cx="470" cy="350" r="9"  fill="#f47d20"/>
  <circle cx="570" cy="240" r="11" fill="#023452"/>
  <circle cx="540" cy="190" r="7"  fill="#037eab"/>

  <!-- the bridge keystone -->
  <g transform="translate(290 200)">
    <polygon points="0,-46 40,-23 40,23 0,46 -40,23 -40,-23" fill="#ffffff" stroke="#023452" stroke-width="4"/>
    <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#f47d20"/>
    <text y="6" text-anchor="middle" font-family="Work Sans, sans-serif" font-weight="800" font-size="20" fill="#ffffff">FAIR</text>
  </g>

  <!-- small label markers -->
  <g font-family="Lato, sans-serif" font-size="14" fill="#023452">
    <text x="40" y="40" font-weight="700">Guidance</text>
    <text x="470" y="380" font-weight="700" text-anchor="start">Everyday practice</text>
  </g>
</svg>
