<?xml version="1.0" encoding="UTF-8"?>
<!--
  The FAIR-in-action Bridge — 8-bit poster, standalone SVG for Adobe Illustrator.
  • Canvas: A0 portrait (width/height in mm); viewBox units = 1/960 of width.
  • Colours are literal hex (no CSS variables).
  • Fonts used: "Press Start 2P" (free, Google Fonts), "Work Sans", "Lato".
    Install them, or in Illustrator select all text > Type > Create Outlines to lock the look.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="841mm" height="1189mm" viewBox="0 0 960 1358" shape-rendering="crispEdges">

  <!-- ===== background ===== -->
  <rect x="0" y="0" width="960" height="1358" fill="#0a1830"/>

  <defs>
    <g id="q">
      <rect x="0" y="0" width="54" height="54" fill="#7a4408"/>
      <rect x="3" y="3" width="48" height="48" fill="#f5a623"/>
      <rect x="3" y="3" width="48" height="9"  fill="#ffce7a"/>
      <rect x="9"  y="9"  width="6" height="6" fill="#7a4408"/><rect x="39" y="9"  width="6" height="6" fill="#7a4408"/>
      <rect x="9"  y="39" width="6" height="6" fill="#7a4408"/><rect x="39" y="39" width="6" height="6" fill="#7a4408"/>
      <text x="27" y="40" text-anchor="middle" font-family="'Press Start 2P',monospace" font-size="24" fill="#ffffff">?</text>
    </g>
    <g id="qg">
      <rect x="0" y="0" width="54" height="54" fill="none" stroke="#ffb060" stroke-width="3" stroke-dasharray="9 7"/>
      <text x="27" y="40" text-anchor="middle" font-family="'Press Start 2P',monospace" font-size="24" fill="#ffb060" opacity="0.5">?</text>
    </g>
    <g id="coin">
      <rect x="-7" y="-9" width="14" height="18" fill="#b9821a"/>
      <rect x="-5" y="-9" width="10" height="18" fill="#ffd24a"/>
      <rect x="-5" y="-9" width="10" height="3"  fill="#fff2b0"/>
      <rect x="-1" y="-6" width="2"  height="12" fill="#b9821a"/>
    </g>
    <g id="floppy">
      <rect x="-13" y="-13" width="26" height="26" fill="#22384a"/>
      <rect x="-13" y="-13" width="26" height="4"  fill="#16252f"/>
      <rect x="3"   y="-13" width="7"  height="9"  fill="#5a7686"/>
      <rect x="-9"  y="2"   width="18" height="10" fill="#cdd9e2"/>
      <rect x="-9"  y="2"   width="18" height="3"  fill="#94a6b3"/>
    </g>
    <g id="laptop">
      <rect x="-24" y="-18" width="48" height="30" fill="#3a4654"/>
      <rect x="-20" y="-14" width="40" height="22" fill="#0c1822"/>
      <rect x="-18" y="-12" width="14" height="3"  fill="#39627a"/>
      <rect x="-28" y="12"  width="56" height="7"  fill="#4a5663"/>
    </g>
    <g id="hero">
      <rect x="3" y="0" width="10" height="2" fill="#6b4a2c"/><rect x="2" y="2" width="12" height="2" fill="#6b4a2c"/>
      <rect x="4" y="4" width="8" height="4" fill="#f0c39a"/>
      <rect x="6" y="5" width="1" height="2" fill="#20140c"/><rect x="9" y="5" width="1" height="2" fill="#20140c"/>
      <rect x="3" y="9" width="10" height="7" fill="#eef2f6"/>
      <rect x="7" y="9" width="1" height="7" fill="#c3d0db"/>
      <rect x="7" y="11" width="1" height="1" fill="#9fb0bd"/><rect x="7" y="13" width="1" height="1" fill="#9fb0bd"/>
      <rect x="1" y="5" width="2" height="5" fill="#eef2f6"/><rect x="13" y="5" width="2" height="5" fill="#eef2f6"/>
      <rect x="1" y="4" width="2" height="1" fill="#f0c39a"/><rect x="13" y="4" width="2" height="1" fill="#f0c39a"/>
      <rect x="4" y="16" width="3" height="5" fill="#34506b"/><rect x="9" y="16" width="3" height="5" fill="#34506b"/>
      <rect x="3" y="21" width="4" height="1" fill="#161616"/><rect x="9" y="21" width="4" height="1" fill="#161616"/>
    </g>
  </defs>

  <!-- ===================== TITLE ===================== -->
  <text x="480" y="92" text-anchor="middle" font-family="'Press Start 2P',monospace" font-size="14" fill="#ffb02e" letter-spacing="2">BIOFAIR PATHFINDER &#183; 2026-27</text>
  <text x="480" y="190" text-anchor="middle" font-family="'Work Sans','Lato',sans-serif" font-weight="900" font-size="66" letter-spacing="-2" fill="#ffffff">The <tspan fill="#ffb02e">FAIR</tspan>-in-action Bridge</text>
  <text x="480" y="248" text-anchor="middle" font-family="'Work Sans','Lato',sans-serif" font-weight="500" font-size="23" fill="#cfe2f0">Collect every resource you like &#8212; without the middle</text>
  <text x="480" y="280" text-anchor="middle" font-family="'Work Sans','Lato',sans-serif" font-weight="800" font-size="23" fill="#ffffff">blocks you never reach FAIR reuse, and data drops in the pit.</text>

  <!-- ===================== GAME SCENE (native 960x720, shifted down) ===================== -->
  <g transform="translate(0,320)">

    <!-- HUD -->
    <g font-family="'Press Start 2P',monospace" font-size="22">
      <text x="40"  y="46" fill="#ffffff">RESOURCES</text>
      <use xlink:href="#coin" transform="translate(296,38)"/>
      <text x="312" y="46" fill="#ffd24a">275</text>
      <text x="560" y="46" fill="#ffffff">REUSED</text>
      <text x="760" y="46" fill="#ff5a4a">0</text>
    </g>

    <!-- ground platforms -->
    <rect x="0"   y="430" width="300" height="290" fill="#7a4a24"/>
    <rect x="0"   y="430" width="300" height="16"  fill="#4aa83f"/>
    <rect x="0"   y="446" width="300" height="6"   fill="#2f7a31"/>
    <g fill="#5c3617"><rect x="0" y="500" width="300" height="4"/><rect x="0" y="560" width="300" height="4"/><rect x="0" y="620" width="300" height="4"/>
      <rect x="96" y="452" width="4" height="268"/><rect x="196" y="452" width="4" height="268"/></g>
    <rect x="660" y="430" width="300" height="290" fill="#7a4a24"/>
    <rect x="660" y="430" width="300" height="16"  fill="#4aa83f"/>
    <rect x="660" y="446" width="300" height="6"   fill="#2f7a31"/>
    <g fill="#5c3617"><rect x="660" y="500" width="300" height="4"/><rect x="660" y="560" width="300" height="4"/><rect x="660" y="620" width="300" height="4"/>
      <rect x="760" y="452" width="4" height="268"/><rect x="860" y="452" width="4" height="268"/></g>

    <!-- left: warp pipe + resource floppies -->
    <g>
      <rect x="40" y="388" width="84" height="18" fill="#36b144"/><rect x="40" y="388" width="84" height="18" fill="none" stroke="#1c5e23" stroke-width="4"/>
      <rect x="52" y="406" width="60" height="24" fill="#2f9a3a"/><rect x="52" y="406" width="60" height="24" fill="none" stroke="#1c5e23" stroke-width="4"/>
    </g>
    <use xlink:href="#floppy" transform="translate(196,406) scale(1.5)"/>
    <use xlink:href="#floppy" transform="translate(242,410) scale(1.5)"/>
    <use xlink:href="#floppy" transform="translate(219,378) scale(1.5)"/>

    <!-- right: FAIR goal flag -->
    <g>
      <rect x="892" y="150" width="8" height="280" fill="#cdd9e2"/>
      <rect x="884" y="146" width="24" height="10" fill="#ffd24a"/>
      <rect x="788" y="168" width="104" height="64" fill="#2f9a3a"/>
      <rect x="788" y="168" width="104" height="64" fill="none" stroke="#16401c" stroke-width="4"/>
      <text x="840" y="212" text-anchor="middle" font-family="'Press Start 2P',monospace" font-size="26" fill="#ffffff">FAIR</text>
    </g>

    <!-- pit: lost laptops + data -->
    <rect x="300" y="640" width="360" height="80" fill="#040a14"/>
    <g>
      <use xlink:href="#laptop" transform="translate(372,632)"/>
      <use xlink:href="#laptop" transform="translate(470,640)"/>
      <use xlink:href="#laptop" transform="translate(566,632)"/>
      <use xlink:href="#floppy" transform="translate(420,648) scale(1.2)"/>
      <use xlink:href="#floppy" transform="translate(520,652) scale(1.2)"/>
    </g>

    <!-- blocks across the gap -->
    <use xlink:href="#q"  x="318" y="360"/>
    <use xlink:href="#q"  x="384" y="360"/>
    <use xlink:href="#qg" x="470" y="360"/>
    <use xlink:href="#qg" x="536" y="360"/>
    <use xlink:href="#qg" x="602" y="360"/>

    <!-- pixel-dotted jump arc (falls short) -->
    <g fill="#ffb060">
      <rect x="452" y="330" width="7" height="7"/><rect x="486" y="312" width="7" height="7"/>
      <rect x="520" y="320" width="7" height="7"/><rect x="556" y="356" width="7" height="7"/>
      <rect x="586" y="420" width="7" height="7"/><rect x="606" y="498" width="7" height="7"/>
      <rect x="616" y="576" width="7" height="7"/>
    </g>

    <!-- falling resources -->
    <use xlink:href="#floppy" transform="translate(566,470) scale(1.2)"/>
    <use xlink:href="#coin"   transform="translate(606,548)"/>

    <!-- jumping hero carrying a floppy -->
    <use xlink:href="#floppy" transform="translate(434,300) scale(1.4)"/>
    <use xlink:href="#hero"   transform="translate(404,300) scale(3.4)"/>

    <!-- callout to the missing blocks -->
    <text x="480" y="250" text-anchor="middle" font-family="'Press Start 2P',monospace" font-size="20" fill="#ffb02e">BUILD THESE</text>
    <g fill="#ffb060"><rect x="476" y="262" width="8" height="8"/><rect x="476" y="276" width="8" height="8"/><rect x="476" y="290" width="8" height="8"/><rect x="468" y="300" width="24" height="8"/><rect x="476" y="312" width="8" height="8"/></g>

    <!-- pit caption -->
    <text x="480" y="712" text-anchor="middle" font-family="'Lato',sans-serif" font-style="italic" font-weight="700" font-size="20" fill="#7f97a9">lost laptops &amp; data at the bottom of the gap</text>
  </g>

  <!-- ===================== FOOTER ===================== -->
  <g transform="translate(0,1120)">
    <line x1="40" y1="0" x2="920" y2="0" stroke="#22384a" stroke-width="2"/>

    <!-- message -->
    <text x="40" y="48" font-family="'Press Start 2P',monospace" font-size="16" fill="#ffffff">THE MISSING</text>
    <text x="40" y="74" font-family="'Press Start 2P',monospace" font-size="16" fill="#ffffff">MIDDLE LAYER</text>
    <text x="40" y="108" font-family="'Lato',sans-serif" font-weight="700" font-size="18" fill="#9fb6c6">Ready-to-use blocks, built by RDM professionals.</text>
    <text x="40" y="134" font-family="'Lato',sans-serif" font-size="17" fill="#7f97a9">Power-ups = RDMkit &#183; FAIR Cookbook &#183; Galaxy &#183; WorkflowHub &#183; FAIRsharing &#183; TeSS</text>

    <!-- QR placeholder (replace with real QR in assets/img) -->
    <g transform="translate(430,20)">
      <rect x="0" y="0" width="96" height="96" fill="#ffffff"/>
      <g fill="#0a1830">
        <rect x="8" y="8" width="24" height="24"/><rect x="14" y="14" width="12" height="12" fill="#ffffff"/><rect x="17" y="17" width="6" height="6" fill="#0a1830"/>
        <rect x="64" y="8" width="24" height="24"/><rect x="70" y="14" width="12" height="12" fill="#ffffff"/><rect x="73" y="17" width="6" height="6" fill="#0a1830"/>
        <rect x="8" y="64" width="24" height="24"/><rect x="14" y="70" width="12" height="12" fill="#ffffff"/><rect x="17" y="73" width="6" height="6" fill="#0a1830"/>
        <rect x="40" y="10" width="6" height="6"/><rect x="52" y="16" width="6" height="6"/><rect x="40" y="40" width="6" height="6"/><rect x="52" y="46" width="6" height="6"/>
        <rect x="64" y="46" width="6" height="6"/><rect x="76" y="52" width="6" height="6"/><rect x="40" y="64" width="6" height="6"/><rect x="46" y="76" width="6" height="6"/><rect x="64" y="70" width="6" height="6"/><rect x="82" y="64" width="6" height="6"/>
      </g>
      <text x="48" y="116" text-anchor="middle" font-family="'Press Start 2P',monospace" font-size="11" fill="#ffb02e">SCAN ME</text>
    </g>

    <!-- contact -->
    <text x="920" y="40" text-anchor="end" font-family="'Press Start 2P',monospace" font-size="14" fill="#ffffff">ELIXIR-UK RDM CLUB</text>
    <text x="920" y="74" text-anchor="end" font-family="'Lato',sans-serif" font-size="18" fill="#cfe2f0">rdm-coordination@elixiruknode.org</text>
    <text x="920" y="100" text-anchor="end" font-family="'Lato',sans-serif" font-size="18" fill="#cfe2f0">elixiruknode.org/project/fair-in-action-bridge</text>
    <text x="920" y="134" text-anchor="end" font-family="'Lato',sans-serif" font-size="16" fill="#7f97a9">Funded by BioFAIR &#183; CC-BY 4.0</text>
  </g>

</svg>
